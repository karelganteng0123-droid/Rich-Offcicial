<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Tester</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      margin: 7px 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
    }

    button {
      background: #5865f2;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      padding: 15px;
      background: #222;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h2>API Tester</h2>

  <input id="apiKey" placeholder="API Key" value="rich01">
  <input id="sender" placeholder="Sender Gmail">
  <input id="password" type="password" placeholder="App Password">
  <input id="target" placeholder="Target Gmail">
  <input id="subject" placeholder="Subject" value="API Test">

  <textarea id="body" placeholder="Message">Koneksi API Berhasil!</textarea>

  <button onclick="testAPI()">TEST API</button>

  <div id="result">Hasil akan muncul di sini...</div>

  <script>
    async function testAPI() {
      const result = document.getElementById("result");

      result.textContent = "Menghubungkan ke API...";

      const data = {
        apiKey: document.getElementById("apiKey").value,
        sender: document.getElementById("sender").value,
        password: document.getElementById("password").value,
        target: document.getElementById("target").value,
        subject: document.getElementById("subject").value,
        body: document.getElementById("body").value
      };

      try {
        const response = await fetch(
          "https://autorep-rich.netlify.app/api/send-email",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
          }
        );

        const text = await response.text();

        let output;

        try {
          output = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
          output = text;
        }

        result.textContent =
          `HTTP STATUS: ${response.status}\n\n${output}`;

      } catch (error) {
        result.textContent =
          "API ERROR:\n\n" + error.message;
      }
    }
  </script>

</body>
</html>
